server:
  port: 8083
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_assessment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aiassess.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 微信小程序配置
wechat:
  miniapp:
    appid: your_appid_here
    secret: your_secret_here
    # 微信API地址（国内直连）
    code2session-url: https://api.weixin.qq.com/sns/jscode2session

# JWT配置
jwt:
  secret: ai-assessment-jwt-secret-key-2024-very-long-string
  expiration: 86400000  # 24小时（毫秒）

# 跨域配置
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600

logging:
  level:
    com.aiassess: debug
    org.springframework.security: warn

# ── 转化功能配置（老师微信/群活码/课程，可直接修改此处，无需数据库）──────────────
app:
  wechat:
    teacher-wechat-id: "sxy15205811430"
    teacher-qrcode-url: "/images/teacher_wechat.png"
    group-qrcode-url: "/images/study_group.png"
  course:
    course-name: "AI算法工程师系统课"
    course-price: "限时优惠价 ¥799"
    course-discount: "从Python基础到模型部署，30天掌握AI算法核心技能"
    course-url: "https://www.xiaoe-tech.com/your-buy-link"
    buy-url: "https://www.xiaoe-tech.com/your-trial-link"
